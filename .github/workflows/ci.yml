name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.21"

jobs:
  test:
    name: Build & Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化："
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet -unsafeptr=false ./...

      - name: go test
        run: go test ./... -v

      - name: build
        shell: bash
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }}" -o wcpilot.exe .

      - name: smoke (help / version / windows)
        shell: bash
        run: |
          ./wcpilot.exe version
          ./wcpilot.exe windows | head -c 300
          echo
          ./wcpilot.exe doctor | head -c 400
          echo

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wcpilot-windows-amd64
          path: |
            wcpilot.exe
            ocr_helper.py
